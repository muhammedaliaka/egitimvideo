[project]
name = "egitim-ses-mcp"
version = "0.1.0"
description = "Ücretsiz seslendirme MCP'si: Microsoft Edge sinir sesleri (çevrimiçi) ve Chatterbox Multilingual (yerel, MIT)."
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2", "edge-tts>=7"]

[project.optional-dependencies]
# Yerel, daha doğal motor. GPU varsa çok daha hızlıdır. Kurulum: uvx --from ".[yerel]" ...
yerel = ["chatterbox-tts==0.1.7"]

[project.scripts]
egitim-ses-mcp = "egitim_ses_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egitim_ses_mcp"]
